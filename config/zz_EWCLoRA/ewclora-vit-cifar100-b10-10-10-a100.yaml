dataset: &dataset binary_cifar100
data_root: ./data/cifar100
init_cls_num: &init_cls_num 10
inc_cls_num: &inc_cls_num 10
total_cls_num: &total_cls_num 100
task_num: &task_num 10
image_size: &image_size 224
epoch: &epoch 20

dataset: *dataset
data_root: ./data/cifar100
init_cls_num: *init_cls_num
inc_cls_num: *inc_cls_num
total_cls_num: *total_cls_num
task_num: *task_num
image_size: *image_size

epoch: *epoch
val_per_epoch: *epoch

batch_size: 128
num_workers: 16
pin_memory: True

seed: 0
deterministic: True

testing_times: 1
testing_per_task: False
setting: task-agnostic

buffer:
  name: LinearBuffer
  kwargs:
    buffer_size: 0
    batch_size: 128
    strategy: herding

train_trfms:
  - RandomResizedCrop:
      size: *image_size
  - RandomHorizontalFlip: {}
  - ToTensor: {}
  - Normalize:
      mean: [0.0, 0.0, 0.0]
      std: [1.0, 1.0, 1.0]

test_trfms:
  - Resize:
      size: *image_size
  - ToTensor: {}
  - Normalize:
      mean: [0.0, 0.0, 0.0]
      std: [1.0, 1.0, 1.0]

optimizer:
  name: Adam
  kwargs:
    lr: 5e-4
    weight_decay: 0.0

lr_scheduler:
  name: CosineAnnealingLR
  kwargs:
    T_max: *epoch
    eta_min: 0.0

backbone:
  name: vit_ewclora
  kwargs:
    pretrained: True
    model_name: vit_base_patch16_224_in21k
    image_size: *image_size
    patch_size: 16
    embed_dim: 768
    depth: 12
    num_heads: 12
    mlp_ratio: 4.0
    qkv_bias: True
    rank: 10
    norm_layer_eps: 1e-6

classifier:
  name: EWCLoRA
  kwargs:
    init_cls_num: *init_cls_num
    inc_cls_num: *inc_cls_num
    task_num: *task_num
    embd_dim: 768
    fc_lrate: 5e-3
    gamma: 1.0
    lambda: 1.0e7
